<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="checklist.title">Checklist | LifeGraph</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <script src="/static/js/locales.js" defer></script>
  <script src="/static/js/app.js" defer></script>
  <script src="/static/js/checklist.js" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/" aria-label="LifeGraph home" data-i18n-aria="common.brandHome"><span class="brand-mark">L</span>LifeGraph</a>
    <nav class="site-nav" aria-label="Main navigation" data-i18n-aria="common.mainNavigation"><a href="/dashboard" data-i18n="common.dashboard">Dashboard</a><a href="/service" data-i18n="common.services">Services</a><a href="/checklist" data-i18n="common.checklist">Checklist</a><a href="/map" data-i18n="common.centres">Centres</a></nav>
    <label class="language-picker"><span class="visually-hidden" data-i18n="language.label">Language</span><select data-language-switch aria-label="Language"><option value="en">English</option><option value="ta">தமிழ்</option></select></label>
    <span class="api-status" data-api-status>Checking API</span>
  </header>
  <main class="page-main catalogue-main" data-checklist-app>
    <p class="eyebrow" data-i18n="checklist.eyebrow">WORKSPACE / PREPARATION</p>
    <h1 class="page-title" data-i18n="checklist.heading">Before you leave</h1>
    <p class="lede" data-i18n="checklist.lede">Review source status and track your private planning reminders.</p>
    <p class="catalogue-feedback" data-catalogue-feedback role="status" aria-live="polite"></p>
    <section class="service-detail checklist-page-detail" data-service-detail aria-live="polite">
      <p class="empty-state" data-i18n="checklist.loading">Loading your selected service…</p>
    </section>
    <p class="checklist-back-link"><a class="text-link" href="/service"><span data-i18n="checklist.browseServices">Browse services</span> <span aria-hidden="true">→</span></a></p>
  </main>
  <footer class="site-footer"><span>LifeGraph <span class="footer-separator">/</span> <span data-i18n="checklist.footerPreparation">Preparation</span></span><span data-i18n="checklist.footerStorage">Reminders stored in this browser only</span></footer>
</body>
</html>
